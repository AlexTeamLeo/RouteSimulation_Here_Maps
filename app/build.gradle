plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.routesimulation'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.routesimulation"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').exists()) {
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
        }

        // 2. Crear la variable para usar en Java (obtiene el valor de local.properties)
        buildConfigField "String", "ACCESS_KEY_ID", properties.getProperty("accessKeyID", "\"\"")
        buildConfigField "String", "ACCESS_KEY_SECRET", properties.getProperty("accessKeySecret", "\"\"")
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude : ['*mock*.jar'])
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.play.services.maps
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}